{% extends "planejamentos/base.html" %}

{% block title %}
    Entrar
{% endblock %}


{% block content %}

<div
    class="card"
    style="max-width: 420px; margin: 70px auto;"
>

    <h2>
        Entrar
    </h2>

    {% if form.errors %}

        <p>
            Usuário ou senha incorretos.
        </p>

    {% endif %}


    <form method="post">

        {% csrf_token %}

        <p>
            <label for="{{ form.username.id_for_label }}">
                Usuário
            </label>

            <br>

            {{ form.username }}
        </p>


        <p>
            <label for="{{ form.password.id_for_label }}">
                Senha
            </label>

            <br>

            {{ form.password }}
        </p>


        <button
            type="submit"
            class="botao"
        >
            Entrar
        </button>

    </form>

</div>

{% endblock %}
