<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Planos de Aula
        {% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #333;
        }

        header {
            background: #2f6680;
            color: white;
            padding: 18px 30px;
        }

        header .conteudo {
            max-width: 1200px;
            margin: 0 auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }

        .botao {
            display: inline-block;
            padding: 10px 16px;

            background: #2f6680;
            color: white;

            border: 0;
            border-radius: 4px;

            text-decoration: none;
            cursor: pointer;
        }

        .botao:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f1f3f5;
        }

        .cabecalho-pagina {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .vazio {
            padding: 30px 0;
            text-align: center;
            color: #666;
        }

        .secao-formulario {
            margin-top: 25px;
        }

        .secao-formulario h3 {
            margin: 0 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #2f6680;
        }

        .grade-formulario {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo-grande {
            grid-column: span 2;
        }

        .campo label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        .campo input,
        .campo select,
        .campo textarea {
            width: 100%;
            padding: 9px 10px;

            border: 1px solid #bbb;
            border-radius: 4px;

            font-size: 14px;
        }

        .campo input:focus,
        .campo select:focus,
        .campo textarea:focus {
            outline: none;
            border-color: #2f6680;
        }

        .acoes-formulario {
            display: flex;
            justify-content: flex-end;

            gap: 10px;

            margin-top: 30px;
            padding-top: 20px;

            border-top: 1px solid #ddd;
        }

        .botao-secundario {
            background: #6c757d;
        }

        .erro {
            margin-top: 5px;
            color: #b42318;
            font-size: 13px;
        }

        .erros-formulario {
            margin: 20px 0;
            padding: 12px 15px;

            background: #fdecec;
            border: 1px solid #efb6b6;
            border-radius: 4px;

            color: #8b1e1e;
        }

        @media (max-width: 800px) {

            .grade-formulario {
                grid-template-columns: 1fr;
            }

            .campo-grande {
                grid-column: span 1;
            }

        }

        .lista-selecao {
            margin-top: 8px;

            border: 1px solid #ddd;
            border-radius: 4px;

            max-height: 320px;
            overflow-y: auto;
        }

        .item-selecao {
            display: flex;
            align-items: flex-start;

            gap: 10px;

            padding: 10px 12px;

            border-bottom: 1px solid #eee;

            cursor: pointer;
        }

        .item-selecao:last-child {
            border-bottom: none;
        }

        .item-selecao:hover {
            background: #f6f8fa;
        }

        .item-selecao input {
            width: auto;
            margin-top: 3px;
        }

        .item-selecao span {
            line-height: 1.4;
        }

    </style>
</head>

<body>

<header>
    <div class="conteudo">

        <h1>
            <a href="{% url 'lista_planejamentos' %}">
                Planos de Aula
            </a>
        </h1>

        {% if user.is_authenticated %}
            <div>
                {{ user.get_full_name|default:user.username }}
            </div>
        {% endif %}

    </div>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>

</html>
